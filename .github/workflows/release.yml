name: Release and Docker Image

on:
  push:
    tags:
      - '[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., 0.1)'
        required: true
        default: '0.0'
      build_docker:
        description: 'Build and push Docker image'
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi

  docker:
    name: Build and Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') && (inputs.build_docker == true || inputs.build_docker == 'true' || inputs.build_docker == null) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multiplatform Image
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          git tag -f "$TAG"
          export TAG
          chmod +x docker/build-image.sh
          ./docker/build-image.sh -m
